spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
  datasource:
    url: jdbc:h2:mem:aboutmetest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  ai:
    openai:
      api-key: test-placeholder-key-for-context-tests-only
      chat:
        enabled: true
    anthropic:
      # Non-empty placeholder so Anthropic chat autoconfig loads in @SpringBootTest (never called against real API).
      api-key: sk-ant-api03-test-placeholder-for-spring-context-only

server:
  port: 0

portfolio:
  ai:
    budget:
      enabled: false
    kill-switch:
      enabled: false
  chat:
    default-model-id: gpt-5.4-mini

logging:
  level:
    org.hibernate.SQL: "off"
    org.springframework.boot.context.config: "warn"

management:
  tracing:
    enabled: false
