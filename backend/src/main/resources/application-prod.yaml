# Production overrides: reduce log leakage, disable Swagger, and avoid logging full prompts/completions.
# Activate with SPRING_PROFILES_ACTIVE=prod (e.g. Railway).

portfolio:
  ai:
    budget:
      enabled: true
      daily-limit-usd: 2.00
      monthly-limit-usd: 20.00
      anonymous-daily-limit-usd: 0.50
      anonymous-monthly-limit-usd: 5.00
  realtime-rate-limit:
    enabled: true
    capacity: 3
    window-seconds: 3600
  sync:
    enabled: false

spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  ai:
    chat:
      observations:
        log-prompt: false
        log-completion: false

logging:
  pattern:
    level: "%5p [${spring.application.name:},trace:%X{traceId:-}] %logger{36} - %msg%n"
  level:
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.springframework.boot.context.config: WARN

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
