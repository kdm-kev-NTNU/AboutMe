# Production overrides: reduce log leakage, disable Swagger, and avoid logging full prompts/completions.
# Activate with SPRING_PROFILES_ACTIVE=prod (e.g. Railway).

portfolio:
  sync:
    enabled: false
  session:
    secure-cookie: true
    jwt-secret: ${PORTFOLIO_JWT_SECRET:}

server:
  forward-headers-strategy: framework

spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  ai:
    chat:
      observations:
        log-prompt: false
        log-completion: false

logging:
  pattern:
    level: "%5p [${spring.application.name:},trace:%X{traceId:-}] %logger{36} - %msg%n"
  level:
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.springframework.boot.context.config: WARN

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 0.1
