# Production overrides: reduce log leakage, disable Swagger, and avoid logging full prompts/completions.
# Activate with SPRING_PROFILES_ACTIVE=prod (e.g. Railway).
#
# OTLP to Phoenix/Arize: enable with OTLP_EXPORT_ENABLED / OTLP_METRICS_EXPORT_ENABLED and set
# PHOENIX_OTLP_ENDPOINT (traces, gRPC), PHOENIX_OTLP_METRICS_URL (metrics, HTTP), PHOENIX_API_KEY as needed.

spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  ai:
    chat:
      observations:
        log-prompt: false
        log-completion: false

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.springframework.boot.context.config: WARN

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
