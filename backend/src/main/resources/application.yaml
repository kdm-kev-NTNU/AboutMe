spring:
  config:
    # Load optional .env as properties (repo root or backend/)
    import: optional:file:./.env[.properties],optional:file:.env[.properties],optional:file:backend/.env[.properties]
  application:
    name: aboutme-backend
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  ai:
    vectorstore:
      pgvector:
        # Embedding dimensions must match spring.ai.openai.embedding.options.dimensions; re-ingest if you change either.
        # 3072 exceeds pgvector HNSW/IVFFlat limits here → index-type NONE (exact search).
        index-type: NONE
        distance-type: COSINE_DISTANCE
        dimensions: 3072
        initialize-schema: true
        # Managed Postgres: schema validation can fail on empty DB before first DDL.
        schema-validation: false
        schema-name: public
        table-name: vector_store
        id-type: TEXT
    openai:
      api-key: ${OPENAI_API_KEY:${SPRING_AI_OPENAI_API_KEY:}}
      chat:
        enabled: ${OPENAI_CHAT_ENABLED:false}
        api-key: ${OPENAI_API_KEY:${SPRING_AI_OPENAI_API_KEY:}}
        options:
          model: gpt-5.5
          max-completion-tokens: ${portfolio.ai.limits.chat-max-completion-tokens:400}
      embedding:
        options:
          model: text-embedding-3-large
          dimensions: 3072
      audio:
        transcription:
          options:
            model: whisper-1
            response-format: TEXT
            language: "no"
            temperature: 0
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-haiku-4-5-20251001
          max-tokens: ${portfolio.ai.limits.chat-max-completion-tokens:400}
    chat:
      observations:
        log-prompt: true
        log-completion: true
  datasource:
    # Compose / manual: set SPRING_DATASOURCE_* . Railway Postgres: link service → PG* vars (used when SPRING_* unset).
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:aboutme}}
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
server:
  port: ${PORT:8080}
portfolio:
  ai:
    limits:
      chat-max-completion-tokens: 400
      judge-max-tokens: 512
      max-question-chars: 3000
      max-feedback-chars: 4000
      max-output-chars: 4000
    budget:
      enabled: true
      daily-limit-usd: 2.00
      monthly-limit-usd: 20.00
      anonymous-daily-limit-usd: 0.50
      anonymous-monthly-limit-usd: 5.00
      spike-hourly-multiplier: 5.0
      anon-identity-salt: ${AI_BUDGET_ANON_SALT:portfolio-ai-budget}
      models:
        gpt-5.4-nano:
          input-per-million-usd: 0.05
          output-per-million-usd: 0.20
        gpt-5.4-mini:
          input-per-million-usd: 0.15
          output-per-million-usd: 0.60
        gpt-5.4:
          input-per-million-usd: 2.50
          output-per-million-usd: 10.00
        gpt-5.5:
          input-per-million-usd: 2.50
          output-per-million-usd: 10.00
        claude-haiku-4-5-20251001:
          input-per-million-usd: 0.80
          output-per-million-usd: 4.00
        claude-sonnet-4-6:
          input-per-million-usd: 3.00
          output-per-million-usd: 15.00
        claude-opus-4-7:
          input-per-million-usd: 5.00
          output-per-million-usd: 25.00
        # Transcription-only (not in SupportedChatModel). Pseudo input tokens = est_seconds * 1000; rate tuned ~Whisper $/min.
        whisper-1:
          input-per-million-usd: 0.10
          output-per-million-usd: 0.00
        gpt-4o-mini-transcribe:
          input-per-million-usd: 0.15
          output-per-million-usd: 0.00
        gpt-4o-transcribe:
          input-per-million-usd: 0.40
          output-per-million-usd: 0.00
    kill-switch:
      enabled: true
      monthly-limit-usd: 50.00
      warn-fraction: 0.80
      check-cron: "0 * * * * *"
  ask-rate-limit:
    enabled: true
    authenticated-capacity: 5
    authenticated-window-seconds: 10
    anonymous-capacity: 3
    anonymous-window-seconds: 10
  experiments:
    run-rate-limit:
      enabled: true
      capacity: 30
      window-seconds: 60
    dataset-generate-rate-limit:
      enabled: true
      capacity: 15
      window-seconds: 300
  chat:
    default-model-id: gpt-5.5
  retrieval:
    # Optional ONNX rerank; Docker image sets paths under /app/rerank (see backend/Dockerfile).
    rerank-enabled: false
    onnx-model-path: ""
    tokenizer-path: ""
    vector-top-k: 40
    candidate-limit: 40
    context-top-k: 40
    rerank-batch-size: 8
    max-passage-chars: 2000
    max-sequence-length: 256
  posthog:
    enabled: ${POSTHOG_ENABLED:false}
    api-key: ${POSTHOG_API_KEY:}
    host: ${POSTHOG_HOST:https://eu.i.posthog.com}
    feature-flag-keys:
      - aboutme_rag_feature_flags
    feature-flags-timeout-ms: 2000
  sanitizer:
    enabled: ${SANITIZER_ENABLED:true}
    redaction-format: "{{{REDACTED-%t}}}"
  # Copy vector_store from Railway (or any remote Postgres) into the local primary DB. Disabled by default; see application-prod.yaml.
  sync:
    enabled: ${SYNC_ENABLED:false}
    source-url: ${SYNC_SOURCE_URL:}
    source-username: ${SYNC_SOURCE_USERNAME:}
    source-password: ${SYNC_SOURCE_PASSWORD:}

sfg:
  aiapp:
    documentsToLoad:
      - classpath:/static/seed/portfolio-seed.md
    documentsToLoadDir: file:./data/docs/
    forceReindex: false
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.boot.context.config: DEBUG

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  metrics:
    tags:
      application: ${spring.application.name}
