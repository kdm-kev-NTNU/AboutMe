spring:
  config:
    import: optional:file:./.env[.properties],optional:file:.env[.properties],optional:file:backend/.env[.properties]
  application:
    name: aboutme-backend
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  ai:
    vectorstore:
      pgvector:
        # Must match spring.ai.openai.embedding.options.dimensions. Changing embedding model/dims
        # requires updating this value and re-ingesting all chunks (truncate vector_store or new DB).
        # HNSW/IVFFlat index max dimension is ~2000 in pgvector; embeddings are 3072 → exact search (no ANN index).
        index-type: NONE
        distance-type: COSINE_DISTANCE
        dimensions: 3072
        initialize-schema: true
        # When true, validation runs before first-time DDL; an empty database can fail first startup on some managed Postgres setups.
        schema-validation: false
        schema-name: public
        table-name: vector_store
        # Chunk ids are content-hash based strings (not UUIDs).
        id-type: TEXT
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-5.4-mini
          # Limit completion tokens per response
          max-completion-tokens: ${portfolio.ai.limits.chat-max-completion-tokens:400}
      # Embedding model + dimensions must stay aligned with vectorstore.pgvector.dimensions above.
      embedding:
        options:
          model: text-embedding-3-large
          dimensions: 3072
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-sonnet-4-6
          max-tokens: ${portfolio.ai.limits.chat-max-completion-tokens:400}
    chat:
      observations:
        log-prompt: true
        log-completion: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aboutme}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
server:
  port: ${PORT:8080}
portfolio:
  ai:
    limits:
      chat-max-completion-tokens: 400
      judge-max-tokens: 512
      max-question-chars: 3000
      max-feedback-chars: 4000
      max-output-chars: 4000
    budget:
      enabled: true
      daily-limit-usd: 2.00
      monthly-limit-usd: 20.00
      anonymous-daily-limit-usd: 0.50
      anonymous-monthly-limit-usd: 5.00
      spike-hourly-multiplier: 5.0
      anon-identity-salt: ${AI_BUDGET_ANON_SALT:portfolio-ai-budget}
      models:
        gpt-5.4-mini:
          input-per-million-usd: 0.15
          output-per-million-usd: 0.60
        gpt-5.4:
          input-per-million-usd: 2.50
          output-per-million-usd: 10.00
        claude-haiku-4-5-20251001:
          input-per-million-usd: 0.80
          output-per-million-usd: 4.00
        claude-sonnet-4-6:
          input-per-million-usd: 3.00
          output-per-million-usd: 15.00
    kill-switch:
      enabled: true
      monthly-limit-usd: 50.00
      warn-fraction: 0.80
      # Every minute (UTC); aligns with default check cadence for global spend
      check-cron: "0 * * * * *"
  ask-rate-limit:
    enabled: true
    authenticated-capacity: 5
    authenticated-window-seconds: 10
    anonymous-capacity: 3
    anonymous-window-seconds: 10
  experiments:
    run-rate-limit:
      enabled: true
      capacity: 10
      window-seconds: 60
  chat:
    # Used when the client omits "model" on POST /ask
    default-model-id: gpt-5.4-mini
  retrieval:
    # Wide retrieval + optional local ONNX cross-encoder rerank. Typical export: optimum-cli export onnx
    # --model cross-encoder/multilingual-MiniLM-L12-v2 <dir> (model.onnx + tokenizer.json in same folder).
    rerank-enabled: false
    onnx-model-path: ""
    tokenizer-path: ""
    vector-top-k: 40
    candidate-limit: 40
    context-top-k: 40
    rerank-batch-size: 8
    max-passage-chars: 2000
    max-sequence-length: 256
  posthog:
    enabled: ${POSTHOG_ENABLED:false}
    api-key: ${POSTHOG_API_KEY:}
    host: ${POSTHOG_HOST:https://eu.i.posthog.com}
    # Keys to resolve via /decide and attach as $feature/<key> on $ai_generation (see PostHogFeatureFlagService).
    feature-flag-keys:
      - aboutme_rag_feature_flags
    feature-flags-timeout-ms: 2000
  sanitizer:
    enabled: ${SANITIZER_ENABLED:true}
    redaction-format: "{{{REDACTED-%t}}}"

sfg:
  aiapp:
    # Explicit classpath seeds (used by startup + admin reseed); dir scan is fallback when this is empty.
    documentsToLoad:
      - classpath:/static/seed/portfolio-seed.md
    documentsToLoadDir: file:./data/docs/
    # When true, startup seeding re-ingests even if chunks already exist for the same content_hash
    forceReindex: false
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.boot.context.config: DEBUG

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  metrics:
    tags:
      application: ${spring.application.name}

