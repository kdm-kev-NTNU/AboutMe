spring:
  config:
    import: optional:file:./.env[.properties],optional:file:.env[.properties],optional:file:backend/.env[.properties]
  application:
    name: aboutme-backend
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  ai:
    vectorstore:
      pgvector:
        # HNSW/IVFFlat index max dimension is ~2000 in pgvector; embeddings are 3072 → exact search (no ANN index).
        index-type: NONE
        distance-type: COSINE_DISTANCE
        dimensions: 3072
        initialize-schema: true
        # When true, validation runs before first-time DDL; an empty database can fail first startup on some managed Postgres setups.
        schema-validation: false
        schema-name: public
        table-name: vector_store
        # Chunk ids are content-hash based strings (not UUIDs).
        id-type: TEXT
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-5.4-mini
          # Limit completion tokens per response
          max-completion-tokens: ${portfolio.ai.limits.chat-max-completion-tokens:400}
      embedding:
        options:
          model: text-embedding-3-large
          dimensions: 3072
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-sonnet-4-6
          max-tokens: ${portfolio.ai.limits.chat-max-completion-tokens:400}
    chat:
      observations:
        log-prompt: true
        log-completion: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aboutme}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
server:
  port: ${PORT:8080}
portfolio:
  ai:
    limits:
      chat-max-completion-tokens: 400
      judge-max-tokens: 512
      max-question-chars: 3000
      max-feedback-chars: 4000
      max-output-chars: 4000
    budget:
      enabled: true
      daily-limit-usd: 2.00
      monthly-limit-usd: 20.00
      anonymous-daily-limit-usd: 0.50
      anonymous-monthly-limit-usd: 5.00
      spike-hourly-multiplier: 5.0
      anon-identity-salt: ${AI_BUDGET_ANON_SALT:portfolio-ai-budget}
      models:
        gpt-5.4-mini:
          input-per-million-usd: 0.15
          output-per-million-usd: 0.60
        gpt-5.4:
          input-per-million-usd: 2.50
          output-per-million-usd: 10.00
        claude-haiku-4-5-20251001:
          input-per-million-usd: 0.80
          output-per-million-usd: 4.00
        claude-sonnet-4-6:
          input-per-million-usd: 3.00
          output-per-million-usd: 15.00
    kill-switch:
      enabled: true
      monthly-limit-usd: 50.00
      warn-fraction: 0.80
      # Every minute (UTC); aligns with default check cadence for global spend
      check-cron: "0 * * * * *"
  ask-rate-limit:
    enabled: true
    authenticated-capacity: 5
    authenticated-window-seconds: 10
    anonymous-capacity: 3
    anonymous-window-seconds: 10
  experiments:
    run-rate-limit:
      enabled: true
      capacity: 10
      window-seconds: 60
  chat:
    # Used when the client omits "model" on POST /ask
    default-model-id: gpt-5.4-mini
  phoenix:
    base-url: ${PHOENIX_BASE_URL:}
    api-key: ${PHOENIX_API_KEY:}
  posthog:
    enabled: ${POSTHOG_ENABLED:false}
    api-key: ${POSTHOG_API_KEY:}
    host: ${POSTHOG_HOST:https://eu.i.posthog.com}
  sanitizer:
    enabled: ${SANITIZER_ENABLED:true}
    redaction-format: "{{{REDACTED-%t}}}"

sfg:
  aiapp:
    # Explicit classpath seeds (used by startup + admin reseed); dir scan is fallback when this is empty.
    documentsToLoad:
      - classpath:/static/seed/portfolio-seed.md
    documentsToLoadDir: file:./data/docs/
    # When true, startup seeding re-ingests even if chunks already exist for the same content_hash
    forceReindex: false
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.boot.context.config: DEBUG

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  metrics:
    tags:
      # Correlate Micrometer metrics (including ai.*) with traces in Phoenix/Arize
      application: ${spring.application.name}
  otlp:
    tracing:
      # Opt-in OTLP: set OTLP_EXPORT_ENABLED=true plus PHOENIX_OTLP_ENDPOINT and PHOENIX_API_KEY (Bearer) for Phoenix/Arize.
      export:
        enabled: ${OTLP_EXPORT_ENABLED:false}
      endpoint: ${PHOENIX_OTLP_ENDPOINT:http://localhost:4317}
      transport: grpc
      headers:
        authorization: Bearer ${PHOENIX_API_KEY:}
    metrics:
      export:
        # Opt-in OTLP metrics (HTTP/protobuf) to Phoenix or an OTel collector; traces above use gRPC on 4317 by default.
        # Self-hosted collector often exposes metrics on 4318. Arize Cloud may use a different ingest URL — set PHOENIX_OTLP_METRICS_URL.
        enabled: ${OTLP_METRICS_EXPORT_ENABLED:false}
        url: ${PHOENIX_OTLP_METRICS_URL:http://localhost:4318/v1/metrics}
        step: 1m
        headers:
          authorization: Bearer ${PHOENIX_API_KEY:}

