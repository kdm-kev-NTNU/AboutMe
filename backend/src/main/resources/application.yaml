spring:
  config:
    import: optional:file:./.env[.properties],optional:file:.env[.properties],optional:file:backend/.env[.properties]
  application:
    name: portfolio
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  ai:
    vectorstore:
      chroma:
        client:
          host: ${CHROMA_HTTP_HOST:http://localhost}
          port: ${CHROMA_PORT:8100}
        collection-name: ${CHROMA_COLLECTION:portfolio-documents}
        initialize-schema: true
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          # Limit completion tokens per response
          max-tokens: 400
      embedding:
        options:
          model: text-embedding-3-large
          dimensions: 3072
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/aboutme?useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
server:
  port: ${PORT}
sfg:
  aiapp:
    documentsToLoadDir: file:./data/docs/
    # When true, startup seeding re-ingests even if chunks already exist for the same content_hash
    forceReindex: false
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.boot.context.config: DEBUG




