spring:
  config:
    import: optional:file:./.env[.properties],optional:file:.env[.properties],optional:file:backend/.env[.properties]
  application:
    name: aboutme-backend
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  ai:
    vectorstore:
      chroma:
        client:
          host: ${CHROMA_HTTP_HOST:http://localhost}
          port: ${CHROMA_PORT:8100}
        collection-name: ${CHROMA_COLLECTION:portfolio-documents}
        initialize-schema: true
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          # Limit completion tokens per response
          max-tokens: 400
      embedding:
        options:
          model: text-embedding-3-large
          dimensions: 3072
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-sonnet-4-20250514
          max-tokens: 400
    chat:
      observations:
        log-prompt: true
        log-completion: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/aboutme?useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
server:
  port: ${PORT}
portfolio:
  chat:
    # Used when the client omits "model" on POST /ask
    default-model-id: gpt-4o-mini

sfg:
  aiapp:
    documentsToLoadDir: file:./data/docs/
    # When true, startup seeding re-ingests even if chunks already exist for the same content_hash
    forceReindex: false
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.boot.context.config: DEBUG

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true

management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${PHOENIX_OTLP_ENDPOINT:http://localhost:4317}
      transport: grpc

