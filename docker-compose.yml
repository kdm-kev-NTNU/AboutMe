include:
  - docker-compose.base.yml

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    develop:
      watch:
        - action: rebuild
          path: ./backend/src
        - action: rebuild
          path: ./backend/pom.xml
    container_name: aboutme-backend
    depends_on:
      db:
        condition: service_healthy
    # Secrets live in repo-root .env (same keys as .env.example). Do not set empty OPENAI_API_KEY here (overrides file).
    env_file:
      - path: .env.docker
        required: false
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/aboutme
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      PORT: "8080"
      SANITIZER_ENABLED: "true"
      PORTFOLIO_JWT_SECRET: ${PORTFOLIO_JWT_SECRET}
      AI_BUDGET_ANON_SALT: ${AI_BUDGET_ANON_SALT}
    ports:
      - "8080:8080"
    volumes:
      - ./backend/data:/app/data:ro

  frontend:
    build:
      context: ./frontend/homepage
      dockerfile: Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ./frontend/homepage/src
        - action: rebuild
          path: ./frontend/homepage/package.json
    container_name: aboutme-frontend
    depends_on:
      - backend
    # VITE_* for the static build must live in frontend/homepage/.env (build context); COPY picks it up at build time.
    env_file:
      - path: frontend/homepage/.env
        required: false
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "5173:80"
