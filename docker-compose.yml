services:
  db:
    image: pgvector/pgvector:pg17
    container_name: aboutme-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aboutme
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aboutme"]
      interval: 5s
      timeout: 5s
      retries: 20

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: aboutme-phoenix
    ports:
      - "6006:6006"
      - "4317:4317"
    volumes:
      - phoenix_data:/mnt/data
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aboutme-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/aboutme
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      PORT: "8080"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PHOENIX_OTLP_ENDPOINT: http://phoenix:4317
      PHOENIX_BASE_URL: http://phoenix:6006
      SANITIZER_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./backend/data:/app/data:ro

  frontend:
    build:
      context: ./frontend/homepage
      dockerfile: Dockerfile
    container_name: aboutme-frontend
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "5173:80"

volumes:
  postgres_data:
  phoenix_data:
