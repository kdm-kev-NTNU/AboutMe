services:
  db:
    image: mysql:lts
    container_name: aboutme-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: aboutme
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Chroma listens on 8000 in-container; host maps 8100 for local dev.
  # Railway private networking is often IPv6-only: if the backend cannot connect to Chroma over
  # *.railway.internal, set CHROMA_HOST_ADDR=:: (or equivalent) on the Chroma service so uvicorn binds IPv6.
  chromadb:
    image: chromadb/chroma:1.0.13
    container_name: aboutme-chromadb
    ports:
      - "8100:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=false
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/8000' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: aboutme-phoenix
    ports:
      - "6006:6006"
      - "4317:4317"
    volumes:
      - phoenix_data:/mnt/data
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data

  # ph-eye: NER service for Phileas PII detection (person names).
  # Image is ~8.9 GB on first pull; cached after that.
  ph-eye:
    image: philterd/ph-eye:1.2.1
    container_name: aboutme-ph-eye
    ports:
      - "18080:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s

  # Valkey (Redis-compatible) for Phileas caching.
  valkey:
    image: valkey/valkey:latest
    container_name: aboutme-valkey
    ports:
      - "6379:6379"
    command: valkey-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aboutme-backend
    depends_on:
      db:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      ph-eye:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/aboutme?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      PORT: "8080"
      CHROMA_HTTP_HOST: http://chromadb
      CHROMA_PORT: "8000"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PHOENIX_OTLP_ENDPOINT: http://phoenix:4317
      PHOENIX_BASE_URL: http://phoenix:6006
      PH_EYE_URL: http://ph-eye:5000
      VALKEY_HOST: valkey
      VALKEY_PORT: "6379"
      SANITIZER_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      # Host seed docs for Chroma (gitignored; matches file:./data/docs/ with WORKDIR /app)
      - ./backend/data:/app/data:ro

  frontend:
    build:
      context: ./frontend/homepage
      dockerfile: Dockerfile
    container_name: aboutme-frontend
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "5173:80"

volumes:
  mysql_data:
  chroma_data:
  phoenix_data:
