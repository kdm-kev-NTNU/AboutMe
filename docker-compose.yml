# Unified Compose: db always available; use profiles for app stacks.
#
#   docker compose up -d db                          # Postgres only (hybrid dev)
#   docker compose --profile dev up                  # Vite HMR + Spring DevTools
#   docker compose --profile prod up -d --build      # Prod-like images (Nginx + JAR)
#   docker compose --profile prod watch              # Rebuild prod images on change

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: aboutme-postgres
    env_file:
      - path: .env.docker
        required: false
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: aboutme
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aboutme"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    profiles: ["prod"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    develop:
      watch:
        - action: rebuild
          path: ./backend/src
        - action: rebuild
          path: ./backend/pom.xml
    container_name: aboutme-backend
    depends_on:
      db:
        condition: service_healthy
    # Secrets live in repo-root .env (same keys as .env.example). Do not set empty OPENAI_API_KEY here (overrides file).
    env_file:
      - path: .env.docker
        required: false
      - path: .env
        required: false
      - path: backend/.env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/aboutme
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
      PORT: "8080"
      SANITIZER_ENABLED: "true"
      PORTFOLIO_JWT_SECRET: ${PORTFOLIO_JWT_SECRET}
      AI_BUDGET_ANON_SALT: ${AI_BUDGET_ANON_SALT}
    ports:
      - "8080:8080"
    volumes:
      - ./backend/data:/app/data:ro

  frontend:
    profiles: ["prod"]
    build:
      context: ./frontend/homepage
      dockerfile: Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ./frontend/homepage/src
        - action: rebuild
          path: ./frontend/homepage/package.json
    container_name: aboutme-frontend
    depends_on:
      - backend
    # VITE_* for the static build must live in frontend/homepage/.env (build context); COPY picks it up at build time.
    env_file:
      - path: frontend/homepage/.env
        required: false
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "5173:80"

  backend-dev:
    profiles: ["dev"]
    image: maven:3.9-eclipse-temurin-21
    container_name: aboutme-backend-dev
    working_dir: /app
    volumes:
      - ./backend:/app
      - m2_cache:/root/.m2
    command: >-
      mvn -B spring-boot:run
      -Dspring-boot.run.jvmArguments="-Dspring.devtools.restart.enabled=true"
    env_file:
      - path: .env.docker
        required: false
      - path: .env
        required: false
      - path: backend/.env
        required: false
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/aboutme
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      PORT: "8080"
      SANITIZER_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend-dev:
    profiles: ["dev"]
    image: node:22-alpine
    container_name: aboutme-frontend-dev
    working_dir: /app
    volumes:
      - ./frontend/homepage:/app
      - fe_node_modules:/app/node_modules
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY_TARGET: http://backend-dev:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend-dev

volumes:
  postgres_data:
  m2_cache:
  fe_node_modules:
