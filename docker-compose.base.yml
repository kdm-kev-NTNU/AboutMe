# Shared PostgreSQL service for prod-like and dev Compose stacks.
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: aboutme-postgres
    env_file:
      - path: .env.docker
        required: false
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: aboutme
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aboutme"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
