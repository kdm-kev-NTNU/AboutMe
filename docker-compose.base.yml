# Shared PostgreSQL service for prod-like and dev Compose stacks.
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: aboutme-postgres
    env_file:
      - path: .env.docker
        required: false
    environment:
      POSTGRES_USER: postgres
      # Compose interpolates from repo-root .env only; default matches .env.docker.example for local dev.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: aboutme
    ports:
      # Default 5433 avoids Windows reserved/blocked 5432; override with POSTGRES_HOST_PORT=5432 if free.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aboutme"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
