server {
  # Suppress [notice] on stderr so platforms that treat stderr as "error" severity stay clean.
  error_log /dev/stderr warn;
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://eu.i.posthog.com https://eu-assets.i.posthog.com; connect-src 'self' https://eu.i.posthog.com wss: https:; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

  location / {
    try_files $uri $uri/ /index.html;
    # Ensure the app shell is always fresh
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  # Explicitly disable caching for index.html
  location = /index.html {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  location /api/ {
    client_max_body_size 55m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_pass ${BACKEND_URL}/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # Ensure upstream sees its own host (needed for edge routing and TLS SNI)
    proxy_set_header Host $proxy_host;
    proxy_ssl_server_name on;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Vite emits content-hashed filenames, so these are safe to cache aggressively.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
}
