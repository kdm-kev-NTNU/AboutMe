version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      all-maven:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /frontend/homepage
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      all-npm:
        patterns:
          - "*"
        exclude-patterns:
          # Transitive of vitest; security bumps fail when parent is still <4.1.11.
          # Pin via package.json overrides + keep vitest / @vitest/coverage-v8 current.
          - "@vitest/mocker"
    ignore:
      - dependency-name: "@vitest/mocker"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
