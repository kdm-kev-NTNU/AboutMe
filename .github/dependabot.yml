version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      all-maven:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /frontend/homepage
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      all-npm:
        patterns:
          - "*"
