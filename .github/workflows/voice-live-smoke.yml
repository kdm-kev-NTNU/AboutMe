# Live voice smoke tests: manual/post-deploy verification for the deployed voice feature.
# This workflow is intentionally separate from the PR merge gate because it can call a live
# deployment and, when enabled, OpenAI Realtime or ElevenLabs token minting.
name: Voice live smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Frontend/base URL to test, e.g. https://example.com'
        required: false
        type: string
      expect_realtime_enabled:
        description: 'Whether /api/realtime/status should report enabled=true'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      run_openai_session:
        description: 'Actually start a live OpenAI Realtime SDP session'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      run_elevenlabs_token:
        description: 'Mint a real ElevenLabs conversation token (needs working /api/realtime/models)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

jobs:
  voice-live-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VOICE_LIVE_BASE_URL: ${{ inputs.base_url || vars.VOICE_LIVE_BASE_URL }}
      VOICE_LIVE_EXPECT_REALTIME_ENABLED: ${{ inputs.expect_realtime_enabled || vars.VOICE_LIVE_EXPECT_REALTIME_ENABLED || 'true' }}
      VOICE_LIVE_RUN_OPENAI: ${{ inputs.run_openai_session || vars.VOICE_LIVE_RUN_OPENAI || 'false' }}
      VOICE_LIVE_RUN_ELEVENLABS: ${{ inputs.run_elevenlabs_token || vars.VOICE_LIVE_RUN_ELEVENLABS || 'false' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6

      - name: Validate live smoke configuration
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VOICE_LIVE_BASE_URL)) {
            throw "Set workflow input base_url or repository variable VOICE_LIVE_BASE_URL."
          }
          Write-Host "VOICE_LIVE_BASE_URL=$env:VOICE_LIVE_BASE_URL"
          Write-Host "VOICE_LIVE_EXPECT_REALTIME_ENABLED=$env:VOICE_LIVE_EXPECT_REALTIME_ENABLED"
          Write-Host "VOICE_LIVE_RUN_OPENAI=$env:VOICE_LIVE_RUN_OPENAI"
          Write-Host "VOICE_LIVE_RUN_ELEVENLABS=$env:VOICE_LIVE_RUN_ELEVENLABS"

      - name: Backend realtime contract smoke
        run: |
          ./scripts/voice-live-smoke.ps1 `
            -BaseUrl $env:VOICE_LIVE_BASE_URL `
            -ExpectRealtimeEnabled ([System.Convert]::ToBoolean($env:VOICE_LIVE_EXPECT_REALTIME_ENABLED)) `
            -CheckElevenLabsToken ([System.Convert]::ToBoolean($env:VOICE_LIVE_RUN_ELEVENLABS))

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/homepage/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/homepage
        run: npm ci

      - name: Cypress voice live smoke
        working-directory: frontend/homepage
        env:
          CYPRESS_VOICE_LIVE: 'true'
          CYPRESS_VOICE_LIVE_EXPECT_REALTIME_ENABLED: ${{ env.VOICE_LIVE_EXPECT_REALTIME_ENABLED }}
          CYPRESS_VOICE_LIVE_RUN_OPENAI: ${{ env.VOICE_LIVE_RUN_OPENAI }}
          CYPRESS_VOICE_LIVE_RUN_ELEVENLABS: ${{ env.VOICE_LIVE_RUN_ELEVENLABS }}
        run: |
          npx cypress run `
            --browser electron `
            --config "baseUrl=$env:VOICE_LIVE_BASE_URL" `
            --spec "cypress/e2e/voice-live-smoke.cy.ts"

      - name: Upload Cypress artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: voice-live-smoke-cypress-artifacts
          path: |
            frontend/homepage/cypress/videos
            frontend/homepage/cypress/screenshots
          if-no-files-found: ignore
