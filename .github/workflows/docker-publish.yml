# Build and push backend + frontend images to Docker Hub (Docker Build Cloud, with
# GitHub-hosted amd64 fallback when Build Cloud concurrent build quota is exhausted).
# Backend uses Dockerfile target publish: JAR is built on the runner (Maven cache) and passed via BuildKit
# context "jar" so Docker Build Cloud does not run Maven per platform (avoids Maven Central 429).
# Triggers: push to main, semver tags v*.*.*, manual workflow_dispatch.
#
# Repo Settings → Secrets and variables → Actions:
#   Variables: DOCKER_ACCOUNT, CLOUD_BUILDER_NAME
#   Secrets: DOCKER_ACCESS_TOKEN, VITE_POSTHOG_KEY, VITE_POSTHOG_HOST, VITE_POSTHOG_ENABLED
name: Docker publish

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time per ref — avoids overlapping Docker Build Cloud slots.
concurrency:
  group: docker-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Backend publish preflight
        shell: bash
        env:
          DOCKER_ACCOUNT: ${{ vars.DOCKER_ACCOUNT }}
          CLOUD_BUILDER_NAME: ${{ vars.CLOUD_BUILDER_NAME }}
          DOCKER_ACCESS_TOKEN: ${{ secrets.DOCKER_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          for name in DOCKER_ACCOUNT CLOUD_BUILDER_NAME DOCKER_ACCESS_TOKEN; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Missing Docker publish config::Missing required values: ${missing[*]}"
            exit 1
          fi
          echo "Docker publish config detected for ${DOCKER_ACCOUNT}/${CLOUD_BUILDER_NAME}."
      # Build JAR once on the runner (Maven cache) instead of inside multi-arch Docker Build Cloud,
      # avoiding Maven Central rate limits (429) when amd64 + arm64 resolve deps in parallel.
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"
          cache-dependency-path: backend/pom.xml
      - name: Maven package (skip tests)
        env:
          MAVEN_OPTS: "-Dmaven.wagon.http.retryHandler.count=5 -Dmaven.wagon.http.retryHandler.requestSentEnabled=true -Dmaven.wagon.httpconnectionManager.ttlSeconds=120 -Daether.connector.http.retryHandler.count=5"
        run: ./mvnw -B --no-transfer-progress clean package -DskipTests=true -Dmaven.test.skip=true -Dmaven.compiler.fork=true -Dmaven.compiler.maxmem=512m
      - name: Prepare JAR context for Docker build
        id: jarctx
        run: |
          JAR_CTX="${RUNNER_TEMP}/aboutme-backend-jar"
          mkdir -p "${JAR_CTX}"
          cp target/*.jar "${JAR_CTX}/"
          echo "path=${JAR_CTX}" >> "${GITHUB_OUTPUT}"
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_ACCOUNT }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
      - uses: docker/setup-buildx-action@v4
        with:
          driver: cloud
          endpoint: "${{ vars.DOCKER_ACCOUNT }}/${{ vars.CLOUD_BUILDER_NAME }}"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKER_ACCOUNT }}/aboutme-backend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
      - name: Build and push backend image
        id: backend_push
        uses: docker/build-push-action@v7
        continue-on-error: true
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: publish
          build-contexts: |
            jar=${{ steps.jarctx.outputs.path }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - name: Setup hosted buildx fallback
        if: steps.backend_push.outcome == 'failure'
        uses: docker/setup-buildx-action@v4
      - name: Build and push backend image (hosted amd64 fallback)
        if: steps.backend_push.outcome == 'failure'
        id: backend_push_fallback
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: publish
          build-contexts: |
            jar=${{ steps.jarctx.outputs.path }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Fail if backend image was not pushed
        if: >-
          steps.backend_push.outcome == 'failure' &&
          (steps.backend_push_fallback.outcome == 'failure' || steps.backend_push_fallback.outcome == 'skipped')
        run: |
          echo "::error::Backend image push failed on Build Cloud and hosted amd64 fallback."
          exit 1

  frontend:
    needs: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Frontend publish preflight
        shell: bash
        env:
          DOCKER_ACCOUNT: ${{ vars.DOCKER_ACCOUNT }}
          CLOUD_BUILDER_NAME: ${{ vars.CLOUD_BUILDER_NAME }}
          DOCKER_ACCESS_TOKEN: ${{ secrets.DOCKER_ACCESS_TOKEN }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          VITE_POSTHOG_ENABLED: ${{ secrets.VITE_POSTHOG_ENABLED }}
        run: |
          set -euo pipefail
          missing=()
          for name in DOCKER_ACCOUNT CLOUD_BUILDER_NAME DOCKER_ACCESS_TOKEN; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Missing Docker publish config::Missing required values: ${missing[*]}"
            exit 1
          fi

          posthog_missing=()
          for name in VITE_POSTHOG_KEY VITE_POSTHOG_HOST VITE_POSTHOG_ENABLED; do
            if [ -z "${!name:-}" ]; then
              posthog_missing+=("$name")
            fi
          done
          if [ "${#posthog_missing[@]}" -gt 0 ]; then
            echo "::warning title=Frontend PostHog args incomplete::Docker image will build without one or more PostHog build args: ${posthog_missing[*]}"
          else
            echo "Frontend PostHog build args detected."
          fi
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_ACCOUNT }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
      - uses: docker/setup-buildx-action@v4
        with:
          driver: cloud
          endpoint: "${{ vars.DOCKER_ACCOUNT }}/${{ vars.CLOUD_BUILDER_NAME }}"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKER_ACCOUNT }}/aboutme-frontend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
      - name: Build and push frontend image
        id: frontend_push
        uses: docker/build-push-action@v7
        continue-on-error: true
        with:
          context: ./frontend/homepage
          file: ./frontend/homepage/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_POSTHOG_KEY=${{ secrets.VITE_POSTHOG_KEY }}
            VITE_POSTHOG_HOST=${{ secrets.VITE_POSTHOG_HOST }}
            VITE_POSTHOG_ENABLED=${{ secrets.VITE_POSTHOG_ENABLED }}
          provenance: true
          sbom: true
      - name: Setup hosted buildx fallback
        if: steps.frontend_push.outcome == 'failure'
        uses: docker/setup-buildx-action@v4
      - name: Build and push frontend image (hosted amd64 fallback)
        if: steps.frontend_push.outcome == 'failure'
        id: frontend_push_fallback
        uses: docker/build-push-action@v7
        with:
          context: ./frontend/homepage
          file: ./frontend/homepage/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_POSTHOG_KEY=${{ secrets.VITE_POSTHOG_KEY }}
            VITE_POSTHOG_HOST=${{ secrets.VITE_POSTHOG_HOST }}
            VITE_POSTHOG_ENABLED=${{ secrets.VITE_POSTHOG_ENABLED }}
      - name: Fail if frontend image was not pushed
        if: >-
          steps.frontend_push.outcome == 'failure' &&
          (steps.frontend_push_fallback.outcome == 'failure' || steps.frontend_push_fallback.outcome == 'skipped')
        run: |
          echo "::error::Frontend image push failed on Build Cloud and hosted amd64 fallback."
          exit 1
