# Tests: PR merge gate (validate only; no deploy or image push).
#
# Triggers: push to main/master; all pull_request events.
# Green means: backend ./mvnw verify (tests + JaCoCo check); frontend npm ci,
#   type-check, lint:ci (eslint, no autofix), unit tests with coverage thresholds.
# Semgrep runs in a separate workflow (.github/workflows/semgrep.yml).
# Cypress e2e is intentionally not in this gate (run locally or add a manual/nightly workflow).
name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: backend/pom.xml
      - name: Maven verify (tests + JaCoCo)
        run: ./mvnw -B verify
      - name: List test and coverage report paths
        if: always()
        run: |
          echo "Surefire reports:" && ls -la target/surefire-reports 2>/dev/null || echo "(none)"
          echo "JaCoCo site:" && ls -la target/site/jacoco 2>/dev/null || echo "(none)"
      - name: Upload backend test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/site/jacoco
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/homepage
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/homepage/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run type-check
      - name: Lint (check only)
        run: npm run lint:ci
      - name: Unit tests with coverage thresholds
        run: npm run test:unit:coverage
      - name: Upload frontend test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-reports
          path: |
            frontend/homepage/test-results
            frontend/homepage/coverage
          if-no-files-found: ignore
