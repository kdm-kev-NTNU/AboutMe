# Tests: PR merge gate (validate only; no deploy or image push).
#
# Triggers: push to main/master; all pull_request events; manual workflow_dispatch.
# Green means: backend ./mvnw verify (tests + JaCoCo check); frontend npm ci,
#   type-check, lint:ci (eslint, no autofix), unit tests with coverage thresholds;
#   Cypress E2E (production build + headless).
# Semgrep runs in a separate workflow (.github/workflows/semgrep.yml).
name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: backend/pom.xml
      - name: Backend preflight
        shell: bash
        run: |
          set -euo pipefail
          test -f ./mvnw
          test -f pom.xml
          java -version
      - name: Maven verify (tests + JaCoCo)
        run: ./mvnw -B verify
      - name: OpenAPI contract (required Springdoc paths)
        run: ./mvnw -B test -Dtest=SecurityConfigIT#openApiSnapshotIncludesEndpointsAndOptionalExport
      - name: List test and coverage report paths
        if: always()
        run: |
          echo "Surefire reports:" && ls -la target/surefire-reports 2>/dev/null || echo "(none)"
          echo "JaCoCo site:" && ls -la target/site/jacoco 2>/dev/null || echo "(none)"
      - name: Upload backend test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/site/jacoco
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/homepage
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
          cache: 'npm'
          cache-dependency-path: frontend/homepage/package-lock.json
      - name: Frontend preflight
        shell: bash
        run: |
          set -euo pipefail
          test -f package-lock.json
          node -v
          npm -v
      - name: Install dependencies
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - name: Typecheck
        run: npm run type-check
      - name: Lint (check only)
        run: npm run lint:ci
      - name: Unit tests with coverage thresholds
        run: npm run test:unit:coverage
      - name: Upload frontend test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-reports
          path: |
            frontend/homepage/test-results
            frontend/homepage/coverage
          if-no-files-found: ignore

  frontend-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Cookie banner only mounts when isPosthogEnabled() is true (Vite env at build time).
    # Dummy values: no real ingestion; unlocks banner/modal E2E without repo secrets.
    env:
      VITE_POSTHOG_ENABLED: 'true'
      VITE_POSTHOG_KEY: phc_ci_e2e_dummy
      VITE_POSTHOG_HOST: https://eu.i.posthog.com
    defaults:
      run:
        working-directory: frontend/homepage
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
          cache: 'npm'
          cache-dependency-path: frontend/homepage/package-lock.json
      - name: Frontend E2E preflight
        shell: bash
        run: |
          set -euo pipefail
          test -f package-lock.json
          node -v
          npm -v
      - name: Install dependencies (includes Cypress binary)
        run: npm ci
      - name: Build production bundle
        run: npm run build-only
      - name: Cypress E2E
        run: npm run test:e2e
      - name: Upload Cypress videos on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-artifacts
          path: |
            frontend/homepage/cypress/videos
            frontend/homepage/cypress/screenshots
          if-no-files-found: ignore

  coverage-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [backend, frontend]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout coverage script
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts/build-coverage-comment.py
          sparse-checkout-cone-mode: false
      - name: Download backend reports
        uses: actions/download-artifact@v8
        with:
          name: backend-test-reports
          path: artifacts/backend
      - name: Download frontend reports
        uses: actions/download-artifact@v8
        with:
          name: frontend-test-reports
          path: artifacts/frontend
      - name: Build coverage summary markdown
        id: coverage_summary
        run: python .github/scripts/build-coverage-comment.py
      - name: Sticky PR coverage comment
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: coverage-summary
          path: coverage-comment.md
