# Tests: PR merge gate (validate only; no deploy or image push).
#
# Triggers: push to main/master; all pull_request events; manual workflow_dispatch.
# Green means: backend ./mvnw verify (tests + JaCoCo check); frontend npm ci,
#   type-check, lint:ci (eslint, no autofix), unit tests with coverage thresholds;
#   Cypress E2E (production build + headless); live model validation (OpenAI + Anthropic).
# Semgrep runs in a separate workflow (.github/workflows/semgrep.yml).
# Model validation is skipped on fork PRs (secrets not available to forks).
name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: backend/pom.xml
      - name: Maven verify (tests + JaCoCo)
        run: ./mvnw -B verify
      - name: List test and coverage report paths
        if: always()
        run: |
          echo "Surefire reports:" && ls -la target/surefire-reports 2>/dev/null || echo "(none)"
          echo "JaCoCo site:" && ls -la target/site/jacoco 2>/dev/null || echo "(none)"
      - name: Upload backend test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/site/jacoco
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/homepage
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/homepage/package-lock.json
      - name: Install dependencies
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - name: Typecheck
        run: npm run type-check
      - name: Lint (check only)
        run: npm run lint:ci
      - name: Unit tests with coverage thresholds
        run: npm run test:unit:coverage
      - name: Upload frontend test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-reports
          path: |
            frontend/homepage/test-results
            frontend/homepage/coverage
          if-no-files-found: ignore

  frontend-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend/homepage
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/homepage/package-lock.json
      - name: Install dependencies (includes Cypress binary)
        run: npm ci
      - name: Build production bundle
        run: npm run build-only
      - name: Cypress E2E
        run: npm run test:e2e
      - name: Upload Cypress videos on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-artifacts
          path: |
            frontend/homepage/cypress/videos
            frontend/homepage/cypress/screenshots
          if-no-files-found: ignore

  model-validation:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: backend/pom.xml
      - name: Live model validation (OpenAI + Anthropic)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: ./mvnw -B test -Dgroups=live -Dtest=LiveModelValidationIT
      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: model-validation-reports
          path: backend/target/surefire-reports
          if-no-files-found: ignore
