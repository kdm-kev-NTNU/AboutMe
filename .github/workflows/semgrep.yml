# Semgrep: SAST + SARIF upload (separate from Tests workflow; no deploy here).
#
# Triggers: push/PR to main or master; weekly schedule. Requires SEMGREP_APP_TOKEN in
# GitHub Actions secrets (Semgrep AppSec Platform). Skipped on fork PRs (no secrets).
# Skips Dependabot PRs (avoid permission issues). PR merge gate for tests: tests.yml.
#
# Uses official semgrep/semgrep image via Docker on the runner so upload-sarif runs
# on the host (codeql-action needs a normal Actions runner, not only the Semgrep container).
#
# See https://semgrep.dev/docs/semgrep-ci/sample-ci-configs

name: Semgrep

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '22 17 * * 1'

permissions:
  contents: read

jobs:
  semgrep:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
      actions: read
    name: Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Semgrep preflight
        id: preflight
        shell: bash
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SEMGREP_APP_TOKEN:-}" ]; then
            echo "::warning title=Semgrep skipped::SEMGREP_APP_TOKEN is not set, so the Semgrep scan will be skipped."
            echo "token_present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "token_present=true" >> "$GITHUB_OUTPUT"
          echo "Semgrep token detected."

      - name: Semgrep CI (scan + SARIF)
        if: steps.preflight.outputs.token_present == 'true'
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/src" \
            -w /src \
            -e SEMGREP_APP_TOKEN \
            -e GITHUB_ACTIONS \
            -e GITHUB_ACTOR \
            -e GITHUB_REF \
            -e GITHUB_REPOSITORY \
            -e GITHUB_SHA \
            -e GITHUB_EVENT_NAME \
            -e GITHUB_HEAD_REF \
            -e GITHUB_BASE_REF \
            -e GITHUB_SERVER_URL \
            -e GITHUB_WORKFLOW \
            -e GITHUB_RUN_ID \
            -e CI=true \
            semgrep/semgrep:latest \
            semgrep ci --sarif --sarif-output=semgrep.sarif
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload SARIF file
        if: steps.preflight.outputs.token_present == 'true' && always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4.37.9
        with:
          sarif_file: semgrep.sarif
