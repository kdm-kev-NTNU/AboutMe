# Git hooks: fast checks on commit, full test+coverage on push.
# Install: https://github.com/evilmartians/lefthook — then run `lefthook install` from repo root.
min_version: 1.6.0

pre-commit:
  parallel: true
  commands:
    frontend-lint:
      root: frontend/homepage
      glob: '*.{ts,vue}'
      run: npm run lint:ci
    frontend-typecheck:
      root: frontend/homepage
      glob: '*.{ts,vue}'
      run: npm run type-check
    backend-compile-unix:
      root: backend
      glob: '*.java'
      os: [linux, darwin]
      run: ./mvnw compile -q -DskipTests
    backend-compile-win:
      root: backend
      glob: '*.java'
      os: [windows]
      run: mvnw.cmd compile -q -DskipTests

pre-push:
  parallel: false
  commands:
    frontend-unit:
      root: frontend/homepage
      run: npm run test:unit:coverage
    backend-verify-unix:
      root: backend
      os: [linux, darwin]
      run: ./mvnw -B verify -q
    backend-verify-win:
      root: backend
      os: [windows]
      run: mvnw.cmd -B verify -q
